<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<meta name="description" content="A quieter way to Sudoku. Daily puzzles and interactive lessons, from your first single to expert techniques. Free, open source, no account needed." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Sudoku · A little more clarity, every day.</title>
<script>try{const t=localStorage.getItem('sudoku-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
